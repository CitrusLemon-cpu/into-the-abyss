<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Depth</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #00111a;
      scroll-behavior: smooth;
    }

    #intro {
      position: relative;
      display: grid;
      width: 1920px;
      height: 1080px;
      place-items: center;
      overflow: hidden;
      color: #e5f8ff;
      background:
        radial-gradient(circle at 77% 18%, rgba(96, 214, 255, 0.34), transparent 27%),
        linear-gradient(145deg, #36aee6 0%, #117eaf 46%, #07527a 100%);
    }

    #intro::before,
    #intro::after {
      position: absolute;
      border: 1px solid rgba(229, 248, 255, 0.16);
      border-radius: 50%;
      content: "";
    }

    #intro::before {
      width: 1050px;
      height: 1050px;
      right: -350px;
      bottom: -540px;
    }

    #intro::after {
      width: 700px;
      height: 700px;
      right: -175px;
      bottom: -365px;
    }

    .intro__content {
      position: relative;
      width: 860px;
      margin-right: 380px;
      z-index: 1;
    }

    .intro__eyebrow {
      margin: 0 0 26px;
      color: rgba(229, 248, 255, 0.76);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .intro__title {
      max-width: 720px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 104px;
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.92;
    }

    .intro__description {
      max-width: 610px;
      margin: 42px 0 0;
      color: rgba(229, 248, 255, 0.88);
      font-size: 24px;
      line-height: 1.55;
    }

    .intro__scale {
      display: flex;
      gap: 38px;
      margin: 48px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .intro__stat {
      display: grid;
      gap: 6px;
    }

    .intro__stat-value {
      font-size: 25px;
      font-weight: 700;
    }

    .intro__stat-label {
      color: rgba(229, 248, 255, 0.7);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .intro__start {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 62px;
      color: #e5f8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .intro__start::after {
      width: 54px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    /* The actual 1:1 ocean coordinate system */
    #ocean {
      position: relative;

      width: 1920px;
      height: 43740px;

      overflow: hidden;

      background: linear-gradient(
        to bottom,
        #168dcc 0px,
        #07527a 500px,
        #022b43 2000px,
        #00131f 5000px,
        #00060a 15000px,
        #000000 43740px
      );
    }

    .zone-marker {
      position: absolute;
      right: 0;
      left: 0;
      border-top: 2px dotted rgba(204, 241, 255, 0.72);
      color: rgba(226, 247, 255, 0.94);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      letter-spacing: 0.04em;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      z-index: 1;
    }

    .zone-marker__label {
      position: absolute;
      top: -11px;
      left: 220px;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(0, 17, 26, 0.62);
      white-space: nowrap;
    }

    .zone-marker--surface .zone-marker__label {
      top: 8px;
    }

    .depth-ruler {
      --meter: 4px;
      --ten-meters: 40px;
      --hundred-meters: 400px;
      position: absolute;
      inset: 0 auto 0 32px;
      width: 190px;
      color: rgba(226, 247, 255, 0.9);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.02em;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 2;
    }

    .depth-ruler::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 132px;
      width: 1px;
      background: rgba(226, 247, 255, 0.72);
      content: "";
    }

    .depth-ruler__ticks {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 57px;
      width: 14px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 calc(var(--meter) - 1px),
        rgba(226, 247, 255, 0.46) calc(var(--meter) - 1px) var(--meter)
      );
    }

    .depth-ruler__ticks--ten {
      width: 25px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 calc(var(--ten-meters) - 1px),
        rgba(226, 247, 255, 0.65) calc(var(--ten-meters) - 1px) var(--ten-meters)
      );
    }

    .depth-ruler__ticks--hundred {
      width: 37px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 calc(var(--hundred-meters) - 2px),
        rgba(226, 247, 255, 0.9) calc(var(--hundred-meters) - 2px) var(--hundred-meters)
      );
    }

    .depth-ruler__label {
      position: absolute;
      right: 69px;
      padding: 2px 5px;
      border-radius: 2px;
      background: rgba(0, 17, 26, 0.56);
      white-space: nowrap;
    }

    .depth-ruler__label--surface {
      top: 8px;
      font-weight: 700;
    }

    .depth-ruler__label--bottom {
      bottom: 0;
      right: auto;
      left: 144px;
      font-weight: 700;
      color: #fff2c2;
    }
  </style>
</head>

<body>

  <header id="intro">
    <div class="intro__content">
      <p class="intro__eyebrow">A one-to-one descent</p>
      <h1 class="intro__title">Into the Abyss</h1>
      <p class="intro__description">Scroll from the ocean surface to Challenger Deep on a true vertical scale. Every four pixels represent one metre of depth.</p>
      <div class="intro__scale" aria-label="Scale and total depth">
        <div class="intro__stat">
          <span class="intro__stat-value">4 px</span>
          <span class="intro__stat-label">equals 1 metre</span>
        </div>
        <div class="intro__stat">
          <span class="intro__stat-value">10,935 m</span>
          <span class="intro__stat-label">total descent</span>
        </div>
      </div>
      <a class="intro__start" href="#ocean">Begin the descent</a>
    </div>
  </header>

  <main id="ocean">
    <!-- Everything inside here uses the 1:1 coordinate system -->
    <aside class="depth-ruler" aria-label="Depth ruler: one metre equals four pixels">
      <div class="depth-ruler__ticks" aria-hidden="true"></div>
      <div class="depth-ruler__ticks depth-ruler__ticks--ten" aria-hidden="true"></div>
      <div class="depth-ruler__ticks depth-ruler__ticks--hundred" aria-hidden="true"></div>
      <span class="depth-ruler__label depth-ruler__label--surface">0 m · surface</span>
      <span class="depth-ruler__label depth-ruler__label--bottom">10,935 m · Challenger Deep</span>
    </aside>
  </main>

  <script>
    const ocean = document.getElementById("ocean");
    const ruler = ocean.querySelector(".depth-ruler");
    const pixelsPerMeter = 4;
    const depthAtBottom = ocean.offsetHeight / pixelsPerMeter;
    const oceanZones = [
      [0, "Epipelagic"],
      [200, "Mesopelagic"],
      [1000, "Bathypelagic"],
      [4000, "Abyssopelagic"],
      [6000, "Hadalpelagic"],
    ];

    for (const [depth, zone] of oceanZones) {
      const marker = document.createElement("div");
      marker.className = `zone-marker${depth === 0 ? " zone-marker--surface" : ""}`;
      marker.style.top = `${depth * pixelsPerMeter}px`;
      marker.setAttribute("aria-label", `${zone} zone begins at ${depth.toLocaleString()} metres`);
      const label = document.createElement("span");
      label.className = "zone-marker__label";
      label.textContent = `${zone} · ${depth.toLocaleString()} m`;
      marker.append(label);
      ocean.append(marker);
    }

    for (let depth = 1000; depth < depthAtBottom; depth += 1000) {
      const label = document.createElement("span");
      label.className = "depth-ruler__label";
      label.style.top = `${depth * pixelsPerMeter}px`;
      label.textContent = `${depth.toLocaleString()} m`;
      ruler.append(label);
    }

    console.log("Ocean dimensions:");
    console.log(ocean.offsetWidth + " × " + ocean.offsetHeight);
    console.log(`Depth at bottom: ${depthAtBottom.toLocaleString()} m`);
  </script>

</body>
</html>
