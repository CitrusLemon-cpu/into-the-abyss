<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical Scale Converter</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #06131b;
      --panel: #0b202b;
      --panel-raised: #102b38;
      --line: #244654;
      --text: #e3f7ff;
      --muted: #8fb2bf;
      --accent: #64dcff;
      --accent-dark: #06212c;
      --error: #ffae9f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(38, 133, 164, .22), transparent 38%),
        var(--background);
    }

    button, input, select { font: inherit; }

    .converter {
      width: min(680px, 100%);
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(11, 32, 43, .94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font: 700 11px/1.2 ui-monospace, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; }
    .intro { max-width: 55ch; margin: 12px 0 30px; color: var(--muted); line-height: 1.55; }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    legend { margin-bottom: 14px; font-weight: 750; }

    .calibration-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .field { display: grid; gap: 7px; }
    .field--wide { grid-column: 1 / -1; }
    label { color: var(--muted); font-size: 13px; font-weight: 650; }

    .input-group { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    input, select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      color: var(--text);
      background: #071923;
      outline: none;
    }

    input { min-width: 0; padding: 10px 13px; border-radius: 8px; }
    .input-group input { border-radius: 8px 0 0 8px; }
    select { width: auto; padding: 9px 34px 9px 11px; border-left: 0; border-radius: 0 8px 8px 0; cursor: pointer; }
    input:focus, select:focus { position: relative; z-index: 1; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(100, 220, 255, .12); }

    .equals {
      display: grid;
      place-items: end center;
      padding-bottom: 14px;
      color: var(--muted);
      font: 700 20px/1 ui-monospace, monospace;
    }

    .reference-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 10px; }

    .divider { height: 1px; margin: 28px 0; background: var(--line); }

    .direction-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #071923;
    }

    .direction-switch button {
      min-height: 42px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .direction-switch button[aria-pressed="true"] { color: var(--accent-dark); background: var(--accent); font-weight: 800; }
    .direction-switch button:focus-visible, .copy-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .result {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid rgba(100, 220, 255, .35);
      border-radius: 12px;
      background: var(--panel-raised);
    }

    .result__label { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    .result__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 6px; }
    output { min-width: 0; color: var(--accent); font: 800 clamp(26px, 7vw, 42px)/1.15 ui-monospace, monospace; overflow-wrap: anywhere; }

    .copy-button {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: #071923;
      cursor: pointer;
    }

    .copy-button:hover { border-color: var(--accent); }
    .formula { margin: 12px 0 0; color: var(--muted); font: 12px/1.5 ui-monospace, monospace; }
    .error { min-height: 20px; margin: 10px 0 0; color: var(--error); font-size: 13px; }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .converter { border-radius: 12px; }
      .reference-row { grid-template-columns: 1fr; }
      .equals { place-items: center; padding: 0; }
      .direction-switch { grid-template-columns: 1fr; }
      .result__row { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="converter">
    <p class="eyebrow">Standalone utility</p>
    <h1>Physical Scale Converter</h1>
    <p class="intro">Define how a real-world length maps to pixels, then convert measurements in either direction.</p>

    <fieldset>
      <legend>1. Define the scale</legend>
      <div class="reference-row">
        <div class="field">
          <label for="reference-length">Known real-life length</label>
          <div class="input-group">
            <input id="reference-length" type="number" min="0.000001" step="any" value="2" inputmode="decimal">
            <select id="reference-unit" aria-label="Known length unit">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m" selected>m</option>
              <option value="km">km</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
              <option value="yd">yd</option>
            </select>
          </div>
        </div>

        <div class="equals" aria-hidden="true">=</div>

        <div class="field">
          <label for="reference-pixels">Corresponding pixel length</label>
          <div class="input-group">
            <input id="reference-pixels" type="number" min="0.000001" step="any" value="619" inputmode="decimal">
            <select aria-label="Pixel unit" disabled><option>px</option></select>
          </div>
        </div>
      </div>
    </fieldset>

    <div class="divider"></div>

    <fieldset>
      <legend>2. Convert a measurement</legend>
      <div class="direction-switch" role="group" aria-label="Conversion direction">
        <button id="to-pixels" type="button" aria-pressed="true">Length → Pixels</button>
        <button id="to-length" type="button" aria-pressed="false">Pixels → Length</button>
      </div>

      <div class="field field--wide">
        <label id="conversion-label" for="conversion-value">Length to convert</label>
        <div class="input-group">
          <input id="conversion-value" type="number" min="0" step="any" value="1" inputmode="decimal">
          <select id="conversion-unit" aria-label="Conversion unit">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m" selected>m</option>
            <option value="km">km</option>
            <option value="in">in</option>
            <option value="ft">ft</option>
            <option value="yd">yd</option>
          </select>
        </div>
      </div>

      <section class="result" aria-live="polite">
        <div class="result__label">Result</div>
        <div class="result__row">
          <output id="result" for="reference-length reference-pixels conversion-value">309.50 px</output>
          <button class="copy-button" id="copy-result" type="button">Copy</button>
        </div>
        <p class="formula" id="formula">1 m × (619 px ÷ 2 m)</p>
      </section>
      <p class="error" id="error" role="alert"></p>
    </fieldset>
  </main>

  <script>
    const METRES_PER_UNIT = {
      mm: 0.001,
      cm: 0.01,
      m: 1,
      km: 1000,
      in: 0.0254,
      ft: 0.3048,
      yd: 0.9144
    };

    const referenceLength = document.getElementById("reference-length");
    const referenceUnit = document.getElementById("reference-unit");
    const referencePixels = document.getElementById("reference-pixels");
    const conversionValue = document.getElementById("conversion-value");
    const conversionUnit = document.getElementById("conversion-unit");
    const conversionLabel = document.getElementById("conversion-label");
    const result = document.getElementById("result");
    const formula = document.getElementById("formula");
    const error = document.getElementById("error");
    const toPixels = document.getElementById("to-pixels");
    const toLength = document.getElementById("to-length");
    const copyResult = document.getElementById("copy-result");
    let direction = "to-pixels";
    let copyText = "309.50 px";

    const formatNumber = (value) => value.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const calculate = () => {
      const knownLength = Number(referenceLength.value);
      const knownPixels = Number(referencePixels.value);
      const input = Number(conversionValue.value);

      if (!Number.isFinite(knownLength) || knownLength <= 0 || !Number.isFinite(knownPixels) || knownPixels <= 0) {
        error.textContent = "The known length and pixel length must both be greater than zero.";
        result.textContent = "—";
        formula.textContent = "Enter a valid scale to calculate a result.";
        copyResult.disabled = true;
        return;
      }

      if (!Number.isFinite(input) || input < 0) {
        error.textContent = "The measurement to convert must be zero or greater.";
        result.textContent = "—";
        formula.textContent = "Enter a valid measurement to calculate a result.";
        copyResult.disabled = true;
        return;
      }

      error.textContent = "";
      copyResult.disabled = false;
      const knownMetres = knownLength * METRES_PER_UNIT[referenceUnit.value];
      const pixelsPerMetre = knownPixels / knownMetres;

      if (direction === "to-pixels") {
        const inputMetres = input * METRES_PER_UNIT[conversionUnit.value];
        const converted = inputMetres * pixelsPerMetre;
        const pixelsPerSelectedUnit = pixelsPerMetre * METRES_PER_UNIT[conversionUnit.value];
        copyText = `${converted.toFixed(2)} px`;
        result.textContent = `${formatNumber(converted)} px`;
        formula.textContent = `${input} ${conversionUnit.value} × ${formatNumber(pixelsPerSelectedUnit)} px/${conversionUnit.value}`;
      } else {
        const convertedMetres = input / pixelsPerMetre;
        const converted = convertedMetres / METRES_PER_UNIT[conversionUnit.value];
        const pixelsPerSelectedUnit = pixelsPerMetre * METRES_PER_UNIT[conversionUnit.value];
        copyText = `${converted.toFixed(2)} ${conversionUnit.value}`;
        result.textContent = `${formatNumber(converted)} ${conversionUnit.value}`;
        formula.textContent = `${input} px ÷ ${formatNumber(pixelsPerSelectedUnit)} px/${conversionUnit.value}`;
      }
    };

    const setDirection = (nextDirection) => {
      direction = nextDirection;
      const convertingToPixels = direction === "to-pixels";
      toPixels.setAttribute("aria-pressed", String(convertingToPixels));
      toLength.setAttribute("aria-pressed", String(!convertingToPixels));
      conversionLabel.textContent = convertingToPixels ? "Length to convert" : "Pixel length to convert";
      conversionUnit.setAttribute("aria-label", convertingToPixels ? "Input length unit" : "Output length unit");
      calculate();
    };

    [referenceLength, referenceUnit, referencePixels, conversionValue, conversionUnit]
      .forEach((control) => control.addEventListener("input", calculate));

    toPixels.addEventListener("click", () => setDirection("to-pixels"));
    toLength.addEventListener("click", () => setDirection("to-length"));

    copyResult.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(copyText);
      } catch {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = copyText;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.append(temporaryInput);
        temporaryInput.select();
        document.execCommand("copy");
        temporaryInput.remove();
      }
      copyResult.textContent = "Copied";
      window.setTimeout(() => { copyResult.textContent = "Copy"; }, 1200);
    });

    calculate();
  </script>
</body>
</html>
